[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mitsu-assistant"
version = "0.1.0"
description = "Mitsu — custom AI desktop assistant, a JARVIS alternative with local Gemma 3 1B support"
requires-python = ">=3.11"

[project.scripts]
mitsu = "main:cli_main"

[tool.setuptools]
py-modules = ["main", "ui"]

[tool.setuptools.packages.find]
include = ["actions*", "agent*", "api*", "awareness*", "config*", "core*", "memory*"]
